name: Recolha semanal

on:
  schedule:
    # Sextas às 21:00 UTC (21h ou 22h em Lisboa, conforme hora de inverno/verão)
    - cron: "0 8 * * *"
  workflow_dispatch: # permite correr à mão em Actions → Recolha semanal → Run workflow

permissions:
  contents: write

concurrency:
  group: recolha-semanal
  cancel-in-progress: false

jobs:
  recolher:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Correr recolha
        run: python script_semanal.py

      - name: Guardar dados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/
          if git diff --staged --quiet; then
            echo "Sem alterações."
          else
            git commit -m "Dados semanais $(date -u +%Y-%m-%d)"
            git push
          fi
